name: poke-app

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-poke}
      POSTGRES_USER: ${POSTGRES_USER:-poke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poke}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-poke}
      DB_USERNAME: ${POSTGRES_USER:-poke}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-poke}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:-change-me-in-env-this-is-only-a-local-dev-secret-32b}
      JWT_TTL: ${JWT_TTL:-2h}
      CACHE_TTL: ${CACHE_TTL:-24h}
      POKEAPI_BASE_URL: ${POKEAPI_BASE_URL:-https://pokeapi.co/api/v2}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # the web service is added with its Dockerfile (task 5.7).

volumes:
  postgres-data:
