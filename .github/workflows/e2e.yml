name: e2e

on:
  push:
    branches: [main]
    paths: ['api/**', 'web/**', 'e2e/**', 'docker-compose.yml', '.github/workflows/e2e.yml']
  pull_request:
    paths: ['api/**', 'web/**', 'e2e/**', 'docker-compose.yml', '.github/workflows/e2e.yml']
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack (postgres, redis, api, web)
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium
      - name: Run the browser checks
        working-directory: e2e
        run: npm test
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
