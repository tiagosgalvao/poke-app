spring:
  application:
    name: poke-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/poke}
    username: ${DB_USERNAME:poke}
    password: ${DB_PASSWORD:poke}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}
  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL:24h}

poke:
  pokeapi:
    base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}
    connect-timeout: ${POKEAPI_CONNECT_TIMEOUT:2s}
    read-timeout: ${POKEAPI_READ_TIMEOUT:5s}
  security:
    jwt-secret: ${JWT_SECRET:change-me-in-env-this-is-only-a-local-dev-secret-32b}
    token-ttl: ${JWT_TTL:2h}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
